<div class="flex min-h-screen items-center justify-center p-6">
  <div class="w-full max-w-md">
    <h1 class="mb-6 text-3xl font-bold">Registrierung</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium"> E-Mail </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded-lg border px-4 py-3"
        />
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium"> Passwort </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded-lg border px-4 py-3"
        />

        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="mt-1 text-sm text-red-600">Das Passwort muss mindestens 8 Zeichen haben.</p>
        }
      </div>

      @if (error()) {
        <p class="text-sm text-red-600">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg border px-4 py-3 font-medium disabled:opacity-50"
      >
        @if (loading()) {
          Registrierung...
        } @else {
          Registrieren
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      Bereits registriert?

      <a routerLink="/login" class="underline"> Login </a>
    </p>
  </div>
</div>
